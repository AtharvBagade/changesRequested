# Settings and models for chreq. Holds no secrets: anthropic reads
# ANTHROPIC_API_KEY and google reads GEMINI_API_KEY, from the environment or a
# gitignored .env (copy .env.example). Model ids are picked once, before Study B.
settings:
  context_token_budget: 6000
  max_attempts: 2
  naive_chunk_lines: 60
  naive_chunk_overlap: 10
  results_dir: results
  # Fixed for every study (CR-05). Do not change it between runs of a study.
  embedding_model: sentence-transformers/all-MiniLM-L6-v2

models:
  - name: claude-main
    provider: anthropic
    model: TODO-pick-before-study-b
  - name: gemini-main
    provider: google
    model: TODO-pick-before-study-b
  - name: local-main
    provider: ollama
    model: qwen3-coder:30b  # chosen in CR-04, see docs/local-model.md
    endpoint: http://localhost:11434/v1
